<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Teacher Settings</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">

            <h3 class="mb-0">
                ⚙ Teacher Settings
            </h3>

        </div>

        <div class="card-body">

            <form action="/update_teacher" method="POST">

                <div class="mb-3">

                    <label class="form-label">
                        Teacher Name
                    </label>

                    <input
                        type="text"
                        name="teacher_name"
                        class="form-control"
                        value="{{ teacher.teacher_name }}"
                        required>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Email
                    </label>

                    <input
                        type="email"
                        name="email"
                        class="form-control"
                        value="{{ teacher.email }}"
                        required>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Mobile
                    </label>

                    <input
                        type="text"
                        name="mobile"
                        class="form-control"
                        value="{{ teacher.mobile or '' }}">

                </div>

                <hr>

                <h5 class="mb-3">
                    🔐 Change Password
                </h5>

                <div class="mb-3">

                    <label class="form-label">
                        New Password
                    </label>

                    <input
                        type="password"
                        name="password"
                        class="form-control"
                        placeholder="Enter new password">

                </div>

                <button
                    type="submit"
                    class="btn btn-success">

                    💾 Save Changes

                </button>

                <a
                    href="/teacher_dashboard"
                    class="btn btn-secondary">

                    ⬅ Back to Dashboard

                </a>

            </form>

        </div>

    </div>

</div>

</body>

</html>
