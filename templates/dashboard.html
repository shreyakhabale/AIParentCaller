<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-dark bg-primary">
    <div class="container-fluid">

        <span class="navbar-brand fw-bold">
            AI Student Absence Notification System
        </span>

        <span class="text-white">
            Welcome, <b>{{ teacher_name }}</b>
        </span>

    </div>
</nav>

<!-- Dashboard -->
<div class="container mt-5">

    <div class="row g-4">

        <!-- Student Management -->
        <div class="col-md-6">
            <a href="/students" class="text-decoration-none text-dark">
                <div class="card shadow h-100">
                    <div class="card-body text-center p-5">

                        <h1>👨‍🎓</h1>

                        <h4>Student Management</h4>

                        <p class="text-muted">
                            Add, Update and Manage Students
                        </p>

                    </div>
                </div>
            </a>
        </div>

        <!-- Daily Attendance -->
        <div class="col-md-6">
            <div class="card shadow h-100">
                <div class="card-body text-center p-5">

                    <h1>✅</h1>

                    <h4>Daily Attendance</h4>

                    <p class="text-muted">
                        Mark Student Attendance
                    </p>

                </div>
            </div>
        </div>

        <!-- Parent Voice Calling -->
        <div class="col-md-6">
            <div class="card shadow h-100">
                <div class="card-body text-center p-5">

                    <h1>📞</h1>

                    <h4>Parent Voice Calling</h4>

                    <p class="text-muted">
                        AI Automatic Parent Calling
                    </p>

                </div>
            </div>
        </div>

        <!-- Call History -->
        <div class="col-md-6">
            <div class="card shadow h-100">
                <div class="card-body text-center p-5">

                    <h1>📜</h1>

                    <h4>Call History</h4>

                    <p class="text-muted">
                        View Previous Calls
                    </p>

                </div>
            </div>
        </div>

    </div>

</div>

</body>
</html>
