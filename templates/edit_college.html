<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit College Profile</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-info text-white d-flex justify-content-between">

            <h3>✏️ Edit College Profile</h3>

            <a href="/college_dashboard" class="btn btn-light">

                ⬅ Back

            </a>

        </div>

        <div class="card-body">

            <form method="POST">

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label>College Name</label>

                        <input
                            type="text"
                            name="college_name"
                            value="{{ college.college_name }}"
                            class="form-control"
                            required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label>College Code</label>

                        <input
                            type="text"
                            name="college_code"
                            value="{{ college.college_code }}"
                            class="form-control"
                            required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label>Email</label>

                        <input
                            type="email"
                            name="email"
                            value="{{ college.email }}"
                            class="form-control"
                            required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label>Username</label>

                        <input
                            type="text"
                            name="username"
                            value="{{ college.username }}"
                            class="form-control"
                            required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label>Password</label>

                        <input
                            type="text"
                            name="password"
                            value="{{ college.password }}"
                            class="form-control"
                            required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label>Phone</label>

                        <input
                            type="text"
                            name="phone"
                            value="{{ college.phone }}"
                            class="form-control"
                            required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label>Calling Number</label>

                        <input
                            type="text"
                            name="calling_number"
                            value="{{ college.calling_number }}"
                            class="form-control"
                            required>

                    </div>

                    <div class="col-md-12 mb-3">

                        <label>Address</label>

                        <textarea
                            name="address"
                            rows="3"
                            class="form-control">{{ college.address }}</textarea>

                    </div>

                </div>

                <button class="btn btn-info">

                    💾 Update College

                </button>

            </form>

        </div>

    </div>

</div>

</body>

</html>
