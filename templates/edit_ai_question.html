<!DOCTYPE html>
<html lang="mr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit AI Question</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>


<body class="bg-light">


<!-- =====================================================
     NAVBAR
===================================================== -->

<nav class="navbar navbar-dark bg-success">

    <div class="container">

        <span class="navbar-brand">

            🤖 Edit Parent Question & AI Answer

        </span>


        <a
            href="{{ url_for('voice_settings') }}"
            class="btn btn-light">

            ⬅ Back

        </a>

    </div>

</nav>



<!-- =====================================================
     MAIN
===================================================== -->

<div class="container mt-5">


    <div class="card shadow">


        <div class="card-header bg-success text-white">

            <h4 class="mb-0">

                ✏️ Edit Parent Question & AI Answer

            </h4>

        </div>



        <div class="card-body">


            <form
                method="POST">


                <!-- Parent Question -->

                <div class="mb-4">

                    <label class="form-label fw-bold">

                        Parent Question

                    </label>


                    <input
                        type="text"
                        name="parent_question"
                        class="form-control"
                        value="{{ question.parent_question }}"
                        required>

                </div>



                <!-- AI Answer -->

                <div class="mb-4">

                    <label class="form-label fw-bold">

                        AI Answer

                    </label>


                    <input
                        type="text"
                        name="ai_answer"
                        class="form-control"
                        value="{{ question.ai_answer }}"
                        required>

                </div>



                <!-- Buttons -->

                <div class="d-flex gap-2">


                    <button
                        type="submit"
                        class="btn btn-success">

                        💾 Save Changes

                    </button>


                    <a
                        href="{{ url_for('voice_settings') }}"
                        class="btn btn-secondary">

                        Cancel

                    </a>


                </div>


            </form>


        </div>

    </div>


</div>



<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


</body>

</html>
