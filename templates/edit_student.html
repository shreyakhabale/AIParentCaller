<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Student</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-warning text-dark d-flex justify-content-between">

            <h3>✏ Edit Student</h3>

            <a href="/students" class="btn btn-dark">

                ⬅ Back

            </a>

        </div>

        <div class="card-body">

            <form method="POST">

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label>Roll Number</label>

                        <input
                            type="number"
                            name="roll_no"
                            value="{{ student.roll_no }}"
                            class="form-control"
                            required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label>Student Name</label>

                        <input
                            type="text"
                            name="student_name"
                            value="{{ student.student_name }}"
                            class="form-control"
                            required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label>Academic Year</label>

                        <input
                            type="text"
                            name="academic_year"
                            value="{{ student.academic_year }}"
                            class="form-control"
                            required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label>Course</label>

                        <input
                            type="text"
                            name="course"
                            value="{{ student.course }}"
                            class="form-control"
                            required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label>Year</label>

                        <select
                            name="year"
                            class="form-select"
                            required>

                            <option value="FY" {% if student.year=="FY" %}selected{% endif %}>FY</option>

                            <option value="SY" {% if student.year=="SY" %}selected{% endif %}>SY</option>

                            <option value="TY" {% if student.year=="TY" %}selected{% endif %}>TY</option>

                            <option value="Final Year" {% if student.year=="Final Year" %}selected{% endif %}>Final Year</option>

                        </select>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label>Gender</label>

                        <select
                            name="gender"
                            class="form-select">

                            <option value="Male" {% if student.gender=="Male" %}selected{% endif %}>Male</option>

                            <option value="Female" {% if student.gender=="Female" %}selected{% endif %}>Female</option>

                            <option value="Other" {% if student.gender=="Other" %}selected{% endif %}>Other</option>

                        </select>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label>Student Mobile</label>

                        <input
                            type="text"
                            name="mobile"
                            value="{{ student.mobile }}"
                            class="form-control">

                    </div>

                    <div class="col-md-6 mb-3">

                        <label>Parent Name</label>

                        <input
                            type="text"
                            name="parent_name"
                            value="{{ student.parent_name }}"
                            class="form-control"
                            required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label>Parent Mobile</label>

                        <input
                            type="text"
                            name="parent_mobile"
                            value="{{ student.parent_mobile }}"
                            class="form-control"
                            required>

                    </div>

                    <div class="col-md-12 mb-3">

                        <label>Address</label>

                        <textarea
                            name="address"
                            rows="3"
                            class="form-control">{{ student.address }}</textarea>

                    </div>

                </div>

                <button class="btn btn-warning">

                    💾 Update Student

                </button>

            </form>

        </div>

    </div>

</div>

</body>

</html>
