<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Teacher</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-lg-7">

            <div class="card shadow">

                <div class="card-header bg-warning">

                    <h3 class="mb-0">
                        ✏ Edit Teacher
                    </h3>

                </div>

                <div class="card-body">

                    <form method="POST">

                        <div class="mb-3">

                            <label class="form-label">
                                Teacher Name
                            </label>

                            <input
                                type="text"
                                name="teacher_name"
                                class="form-control"
                                value="{{ teacher.teacher_name }}"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Email
                            </label>

                            <input
                                type="email"
                                name="email"
                                class="form-control"
                                value="{{ teacher.email }}"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Username
                            </label>

                            <input
                                type="text"
                                name="username"
                                class="form-control"
                                value="{{ teacher.username }}"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Mobile
                            </label>

                            <input
                                type="text"
                                name="mobile"
                                class="form-control"
                                value="{{ teacher.mobile }}"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Password
                            </label>

                            <input
                                type="text"
                                name="password"
                                class="form-control"
                                value="{{ teacher.password }}"
                                required>

                        </div>

                        <button class="btn btn-warning w-100">

                            💾 Update Teacher

                        </button>

                    </form>

                    <hr>

                    <a href="/teacher_list"
                       class="btn btn-secondary">

                        ⬅ Back to Teacher List

                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
