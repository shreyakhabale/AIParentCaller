<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Parent Calling Script</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <span class="navbar-brand">
            🤖 Edit Parent Calling Script
        </span>

        <a
            href="{{ url_for('voice_settings') }}"
            class="btn btn-light">

            ⬅ Back

        </a>

    </div>

</nav>


<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">

            <h4 class="mb-0">
                📝 Edit Parent Calling Script
            </h4>

        </div>

        <div class="card-body">

            <form
                action="{{ url_for('update_calling_script') }}"
                method="POST">

                <label class="form-label">

                    Parent Calling Script

                </label>

                <textarea
                    name="call_script"
                    rows="12"
                    class="form-control"
                    required>{{ settings.call_script }}</textarea>


                <div class="d-flex gap-2 mt-4">

                    <button
                        type="submit"
                        class="btn btn-success">

                        💾 Save Changes

                    </button>


                    <a
                        href="{{ url_for('voice_settings') }}"
                        class="btn btn-secondary">

                        ❌ Cancel

                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

</body>

</html>
