<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Teacher</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>


<body class="bg-light">


<!-- =====================================================
     NAVBAR
===================================================== -->

<nav class="navbar navbar-dark bg-primary mb-4">

    <div class="container">

        <span class="navbar-brand">
            🏫 AI Student Absence Notification System
        </span>

        <a
            href="/college_dashboard"
            class="btn btn-light">

            ⬅ College Dashboard

        </a>

    </div>

</nav>


<!-- =====================================================
     MAIN CONTAINER
===================================================== -->

<div class="container">


    <div class="row justify-content-center">

        <div class="col-lg-7">


            <div class="card shadow">


                <!-- HEADER -->

                <div class="card-header bg-success text-white">

                    <h3 class="mb-0">

                        👨‍🏫 Create Teacher Account

                    </h3>

                </div>


                <!-- BODY -->

                <div class="card-body">


                    <!-- FLASH MESSAGE -->

                    {% with messages = get_flashed_messages() %}

                        {% if messages %}

                            {% for message in messages %}

                                <div class="alert alert-info">

                                    {{ message }}

                                </div>

                            {% endfor %}

                        {% endif %}

                    {% endwith %}


                    <!-- FORM -->

                    <form method="POST">


                        <!-- TEACHER NAME -->

                        <div class="mb-3">

                            <label class="form-label">

                                Teacher Name

                            </label>

                            <input
                                type="text"
                                name="teacher_name"
                                class="form-control"
                                placeholder="Enter teacher name"
                                required>

                        </div>


                        <!-- EMAIL -->

                        <div class="mb-3">

                            <label class="form-label">

                                Email

                            </label>

                            <input
                                type="email"
                                name="email"
                                class="form-control"
                                placeholder="Enter Email"
                                required>

                        </div>


                        <!-- USERNAME -->

                        <div class="mb-3">

                            <label class="form-label">

                                Username

                            </label>

                            <input
                                type="text"
                                name="username"
                                class="form-control"
                                placeholder="Enter username">

                            

                        </div>


                        <!-- MOBILE -->

                        <div class="mb-3">

                            <label class="form-label">

                                Mobile Number

                            </label>

                            <input
                                type="text"
                                name="mobile"
                                class="form-control"
                                maxlength="15"
                                placeholder="Enter mobile number"
                                required>

                        </div>



                        <!-- PASSWORD -->

                        <div class="mb-3">

                            <label class="form-label">

                                Password

                            </label>

                            <input
                                type="password"
                                name="password"
                                class="form-control"
                                placeholder="Enter password"
                                required>

                        </div>


                        <!-- BUTTON -->

                        <button
                            type="submit"
                            class="btn btn-success w-100">

                            ➕ Create Teacher

                        </button>


                    </form>


                    <hr>


                    <!-- BACK -->

                    <a
                        href="/college_dashboard"
                        class="btn btn-secondary w-100">

                        ⬅ Back to College Dashboard

                    </a>


                </div>

            </div>


        </div>

    </div>


</div>


<!-- =====================================================
     BOOTSTRAP JS
===================================================== -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


</body>

</html>
