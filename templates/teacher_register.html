<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Teacher</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-lg-7">

            <div class="card shadow">

                <!-- Header -->
                <div class="card-header bg-success text-white">
                    <h3 class="mb-0">👨‍🏫 Create Teacher Account</h3>
                </div>

                <div class="card-body">

                    <!-- Flash Messages -->
                    {% with messages = get_flashed_messages() %}
                        {% if messages %}

                            {% for message in messages %}

                                <div class="alert alert-info alert-dismissible fade show">

                                    {{ message }}

                                    <button
                                        type="button"
                                        class="btn-close"
                                        data-bs-dismiss="alert">
                                    </button>

                                </div>

                            {% endfor %}

                        {% endif %}
                    {% endwith %}


                    <!-- Create Teacher Form -->
                    <form method="POST">

                        <!-- Teacher Name -->
                        <div class="mb-3">

                            <label class="form-label">
                                Teacher Name
                            </label>

                            <input
                                type="text"
                                name="teacher_name"
                                class="form-control"
                                placeholder="Enter teacher name"
                                required>

                        </div>


                        <!-- Email -->
                        <div class="mb-3">

                            <label class="form-label">
                                Email
                            </label>

                            <input
                                type="email"
                                name="email"
                                class="form-control"
                                placeholder="Enter teacher email"
                                required>

                        </div>


                        <!-- Username -->
                        <div class="mb-3">

                            <label class="form-label">
                                Username
                            </label>

                            <input
                                type="text"
                                name="username"
                                class="form-control"
                                placeholder="Enter username"
                                required>

                        </div>


                        <!-- Password -->
                        <div class="mb-3">

                            <label class="form-label">
                                Password
                            </label>

                            <input
                                type="password"
                                name="password"
                                class="form-control"
                                placeholder="Enter password"
                                required>

                        </div>


                        <!-- Mobile Number -->
                        <div class="mb-3">

                            <label class="form-label">
                                Mobile Number
                            </label>

                            <input
                                type="text"
                                name="mobile"
                                class="form-control"
                                placeholder="Enter 10 digit mobile number"
                                maxlength="10"
                                required>

                        </div>


                        <!-- Create Button -->
                        <button
                            type="submit"
                            class="btn btn-success w-100">

                            ➕ Create Teacher

                        </button>

                    </form>


                    <hr class="my-4">


                    <!-- Navigation Buttons -->
                    <div class="d-grid gap-2">

                        <a
                            href="/teacher_list"
                            class="btn btn-primary">

                            📋 View Teacher List

                        </a>


                        <a
                            href="/college_dashboard"
                            class="btn btn-secondary">

                            ⬅ Back to Dashboard

                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
